<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Deep Game</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1d2b3a;
    --cream:#fff6e3;
    --gold:#ffc93c;
    --gold-dark:#e09b1a;
    --orange:#ff8a3d;
    --sea:#1e9be0;
    --deep:#06253f;
    --panel:#123a57;
    --green:#4cd964;
    --red:#ff5a5a;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;touch-action:none}
  html,body{width:100%;height:100%;overflow:hidden;background:#04121f;font-family:"Baloo 2","Arial Rounded MT Bold","Nunito","Segoe UI",system-ui,sans-serif}
  #stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  #wrap{position:relative;height:100%;aspect-ratio:9/16;max-width:100vw;max-height:100vh}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
  .overlay{position:absolute;inset:0;display:none;align-items:center;justify-content:center;z-index:20}
  .overlay.show{display:flex}
  .dim{position:absolute;inset:0;background:rgba(3,16,30,.72);backdrop-filter:blur(2px)}
  .panel{
    position:relative;width:88%;max-height:86%;overflow:hidden auto;border-radius:28px;
    background:linear-gradient(180deg,#1b4b70,#123a57);
    border:5px solid #0b2a41;box-shadow:0 12px 0 #071e30, inset 0 3px 0 rgba(255,255,255,.25);
    padding:20px 18px 24px;color:#eaf6ff;
    animation:pop .35s cubic-bezier(.34,1.56,.64,1);
    scrollbar-width:none;
  }
  .panel::-webkit-scrollbar{display:none}
  @keyframes pop{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}
  h2.ptitle{
    text-align:center;font-size:26px;letter-spacing:1px;color:#fff;
    text-shadow:0 3px 0 rgba(0,0,0,.35);margin-bottom:14px
  }
  .closeX{
    position:absolute;top:10px;right:10px;width:44px;height:44px;border-radius:16px;border:none;
    background:linear-gradient(180deg,#ff7a6b,#e04b3c);color:#fff;font-size:22px;font-weight:800;
    box-shadow:0 5px 0 #a12f24;cursor:pointer;font-family:inherit
  }
  .closeX:active{transform:translateY(4px);box-shadow:0 1px 0 #a12f24}
  .sect{display:flex;align-items:center;gap:12px;margin:20px 0 12px;color:#ffd95c;font-weight:800;font-size:15px;letter-spacing:1.5px}
  .sect::before,.sect::after{content:'';flex:1;height:3px;background:rgba(0,0,0,.28);border-radius:2px}
  .sect .sicon{width:34px;height:34px;flex:none}
  .sect .sicon svg{width:100%;height:100%}
  .sectLine{display:block;height:3px;margin:22px 0 14px;background:rgba(0,0,0,.28);border-radius:2px}
  .corkboard{
    height:262px;overflow-y:auto;overflow-x:hidden;
    background-color:#a87c4a;
    background-image:
      radial-gradient(rgba(255,236,205,.10) 1.6px, transparent 1.9px),
      radial-gradient(rgba(92,58,24,.16) 2.1px, transparent 2.4px),
      radial-gradient(ellipse at 30% 20%, rgba(255,226,180,.14), rgba(255,226,180,0) 60%),
      radial-gradient(ellipse at 75% 80%, rgba(70,42,16,.16), rgba(70,42,16,0) 62%),
      linear-gradient(180deg, rgba(255,240,215,.07), rgba(60,35,12,.14));
    background-size:14px 14px, 22px 22px, 100% 100%, 100% 100%, 100% 100%;
    background-position:4px 6px, 0 0, 0 0, 0 0, 0 0;
    border:9px solid #7d5227;
    border-radius:22px;
    box-shadow:
      inset 0 0 22px rgba(70,42,16,.35),
      inset 0 3px 8px rgba(255,235,205,.10),
      0 4px 0 rgba(74,45,16,.55);
    padding:18px 14px 16px;position:relative;
    display:block;
    scrollbar-width:thin
  }
  .corkboard::-webkit-scrollbar{width:6px}
  .corkboard::-webkit-scrollbar-thumb{background:rgba(90,58,26,.45);border-radius:3px}
  .photoPin{
    float:right;margin:0 0 10px 12px;width:69px;position:relative;
    background:#f4efe2;padding:5px 5px 14px;border-radius:3px;
    box-shadow:0 6px 12px rgba(40,22,6,.42), 0 1px 0 rgba(255,255,255,.6) inset;
    transform:rotate(3.4deg);z-index:3
  }
  .photoPin::before{
    content:'';position:absolute;top:-7px;left:50%;margin-left:-7px;width:14px;height:14px;border-radius:50%;
    background:radial-gradient(circle at 34% 28%, #9fdcff, #2f6fd0 68%, #1a3f8a);
    box-shadow:0 3px 5px rgba(40,20,5,.4)
  }
  .photoPin svg{display:block;width:100%;height:auto;border-radius:1px}
  .photoPin .cap{
    position:absolute;left:0;right:0;bottom:4px;text-align:center;
    font-family:"Segoe Script","Comic Sans MS",cursive;font-size:7.5px;color:#6b5535
  }
  .pinNote{
    position:relative;display:inline-block;vertical-align:top;
    width:calc(50% - 12px);margin:0 5px 12px 0;
    background:linear-gradient(180deg,#fffaf0,#f6e9cd);
    border:none;border-radius:9px;
    padding:16px 11px 11px;color:#4c3a1e;
    font-family:"Segoe Script","Comic Sans MS",cursive;font-size:13px;line-height:1.42;
    box-shadow:0 5px 10px rgba(50,28,8,.28), 0 1px 0 rgba(255,255,255,.5) inset
  }
  .pinNote::before{
    content:'';position:absolute;top:-6px;left:50%;margin-left:-7px;width:14px;height:14px;border-radius:50%;
    background:radial-gradient(circle at 34% 28%, #ff9c8d, #d0342a 68%, #96241c);
    box-shadow:0 3px 5px rgba(40,20,5,.4)
  }
  .pinNote:nth-child(3n+2)::before{
    background:radial-gradient(circle at 34% 28%, #8fe89a, #2fae4a 65%, #17641f)
  }
  .pinNote:nth-child(3n)::before{
    background:radial-gradient(circle at 34% 28%, #8fb8ff, #2f6fd0 65%, #1a3f8a)
  }
  .card{
    background:rgba(255,255,255,.08);border:3px solid rgba(0,0,0,.25);border-radius:20px;
    padding:14px;margin-bottom:12px;box-shadow:inset 0 2px 0 rgba(255,255,255,.15)
  }
  .row{display:flex;align-items:center;gap:12px}
  .uicon{width:64px;height:64px;flex:none}
  .grow{flex:1;min-width:0}
  .uname{font-weight:800;font-size:17px;color:#fff}
  .udesc{font-size:12.5px;color:#bcdcf2;line-height:1.35;margin-top:2px}
  .pips{display:flex;gap:4px;margin-top:8px}
  .pip{flex:1;height:10px;border-radius:6px;background:rgba(0,0,0,.35);border:2px solid rgba(0,0,0,.35)}
  .pip.on{background:linear-gradient(180deg,#ffd95c,#f2a91e);border-color:#c07d00}
  .buy{
    margin-top:10px;width:100%;padding:11px;border-radius:16px;border:3px solid #1c7a2e;
    background:linear-gradient(180deg,#63e07c,#2fae4a);color:#fff;font-family:inherit;font-weight:800;
    font-size:16px;cursor:pointer;box-shadow:0 5px 0 #17641f;text-shadow:0 2px 0 rgba(0,0,0,.25)
  }
  .buy:active{transform:translateY(4px);box-shadow:0 1px 0 #17641f}
  .buy.no{filter:grayscale(.9);opacity:.6}
  .buy.max{background:linear-gradient(180deg,#ffd95c,#f2a91e);border-color:#c07d00;box-shadow:0 5px 0 #8f5c00;color:#5a3a00;text-shadow:none}
  .subScroll{
    max-height:230px;overflow-y:auto;overflow-x:hidden;
    background:linear-gradient(180deg, rgba(0,0,0,.10), rgba(0,0,0,.26));
    border:3px solid rgba(0,0,0,.28);border-radius:18px;
    padding:14px 12px 10px;margin-bottom:6px;scrollbar-width:thin
  }
  .subScroll::-webkit-scrollbar{width:6px}
  .subScroll::-webkit-scrollbar-thumb{background:rgba(255,255,255,.22);border-radius:3px}
  .stock{display:flex;flex-wrap:wrap;gap:12px}
  .slot{
    width:calc(33.33% - 8px);aspect-ratio:1;background:none;border:none;
    display:flex;align-items:flex-end;justify-content:center;cursor:pointer;position:relative
  }
  .slot svg{width:92%;height:92%;filter:drop-shadow(0 4px 5px rgba(0,0,0,.45))}
  .slot::after{
    content:'';position:absolute;bottom:2px;left:50%;width:56%;height:9px;margin-left:-28%;
    background:radial-gradient(ellipse at center, rgba(0,0,0,.45), rgba(0,0,0,0) 70%);
    border-radius:50%;pointer-events:none
  }
  @keyframes swayA{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}}
  @keyframes swayB{0%,100%{transform:rotate(7deg)}50%{transform:rotate(-7deg)}}
  .slot svg{transform-origin:50% 88%}
  .slot:nth-child(odd) svg{animation:swayA 2.4s ease-in-out infinite}
  .slot:nth-child(even) svg{animation:swayB 2.8s ease-in-out infinite}
  .slot:active svg{filter:drop-shadow(0 2px 3px rgba(0,0,0,.5)) brightness(1.12)}
  .emptyMsg{text-align:center;color:#9cc6e4;font-size:13.5px;padding:14px 6px;line-height:1.5}

  #reveal .dim{background:rgba(2,10,20,.85)}
  #revealBox{position:relative;width:82%;display:flex;flex-direction:column;align-items:center;gap:14px}
  #revealArt{width:200px;height:200px}
  #noteCard{
    width:100%;background:#fdf3d8;border-radius:16px;border:3px solid #cbb37f;
    box-shadow:0 10px 0 rgba(0,0,0,.35);padding:22px 20px;color:#4c3a1e;
    font-family:"Segoe Script","Comic Sans MS",cursive;font-size:19px;line-height:1.5;text-align:center;
    transform:scaleY(0);transform-origin:top;transition:transform .5s cubic-bezier(.34,1.4,.64,1)
  }
  #noteCard.open{transform:scaleY(1)}
  .bigBtn{
    padding:14px 34px;border-radius:22px;border:4px solid #c07d00;
    background:linear-gradient(180deg,#ffd95c,#f2a91e);color:#5a3a00;font-family:inherit;font-weight:800;
    font-size:20px;cursor:pointer;box-shadow:0 7px 0 #8f5c00;letter-spacing:.5px
  }
  .bigBtn:active{transform:translateY(5px);box-shadow:0 2px 0 #8f5c00}
  #toast{
    position:absolute;left:50%;top:12%;transform:translateX(-50%);z-index:40;pointer-events:none;
    background:rgba(6,30,48,.92);border:3px solid #0b2a41;border-radius:16px;color:#ffd95c;
    font-weight:800;padding:10px 18px;font-size:15px;opacity:0;transition:opacity .25s;white-space:nowrap;
    box-shadow:0 5px 0 rgba(0,0,0,.4)
  }
</style>
</head>
<body>
<div id="stage"><div id="wrap">
<canvas id="cv"></canvas>
<div id="toast"></div>
<div class="overlay" id="room">
<div class="dim" onclick="closeRoom()"></div>
<div class="panel">
<button class="closeX" onclick="closeRoom()">✕</button>
<h2 class="ptitle">KABİN</h2>
<div id="roomBody"></div>
</div>
</div>
<div class="overlay" id="reveal">
<div class="dim"></div>
<div id="revealBox">
<div id="revealArt"></div>
<div id="noteCard"></div>
<button class="bigBtn" id="revealBtn" style="display:none">Tamam</button>
</div>
</div>
</div></div>
<script>

const SUBPAL = {
  OUT:'#6b3410', OUT_L:'#8a4a18',
  HI:'#fff0c8', L:'#ffc478', BASE:'#ffa855', D:'#f07d38', XD:'#c05f24',
  RIVET_D:'rgba(107,52,16,.26)', RIVET_L:'rgba(255,222,175,.55)',
  SEAM:'rgba(107,52,16,.22)', SEAM_L:'rgba(255,214,160,.35)'
};
function drawSubmarine(g, x, y, s, o){
  o = o || {};
  const t = o.t || 0;
  const winScale = o.winScale || 1;

  const OUT   = SUBPAL.OUT;
  const OUT_L = SUBPAL.OUT_L;
  const OR_HI = SUBPAL.HI;
  const OR_L  = SUBPAL.L;
  const OR    = SUBPAL.BASE;
  const OR_D  = SUBPAL.D;
  const OR_XD = SUBPAL.XD;

  const MET   = SUBPAL.L;
  const MET_D = SUBPAL.D;
  const MET_XD= SUBPAL.XD;
  const STEEL = '#c9c3bb';
  const STEEL_D='#8a8480';
  const STEEL_XD='#5f5a56';
  const GL_HI = '#cfe9ff';
  const GL_M  = '#3f86c9';
  const GL_D  = '#1a4577';
  const GL_XD = '#102c4f';

  g.save();
  g.translate(x,y);
  g.rotate(o.tilt||0);
  if(o.flip) g.scale(-1,1);
  g.scale(s,s);
  g.lineJoin='round'; g.lineCap='round';

  const LW = 3.2;

  const bodyPath=()=>{
    g.beginPath();
    g.moveTo(-46,-6);
    g.bezierCurveTo(-45,-22, -28,-31, -2,-31);
    g.bezierCurveTo( 22,-31,  38,-22,  42,-8);
    g.bezierCurveTo( 44,-2,   44, 2,   42, 8);
    g.bezierCurveTo( 38, 22,  22, 31,  -2, 31);
    g.bezierCurveTo(-28, 31, -45, 22, -46, 6);
    g.bezierCurveTo(-47, 2,  -47,-2, -46,-6);
    g.closePath();
  };

  g.save(); bodyPath(); g.clip();
  const ss=g.createRadialGradient(-46,0,1,-46,0,16);
  ss.addColorStop(0,'rgba(90,36,6,.5)'); ss.addColorStop(1,'rgba(90,36,6,0)');
  g.fillStyle=ss; g.beginPath(); g.ellipse(-46,0,16,12,0,0,TAU); g.fill();
  g.restore();

  g.save();
  g.translate(-56,0);

  g.fillStyle=STEEL_D; g.strokeStyle=OUT; g.lineWidth=LW;
  g.beginPath();
  g.moveTo(4,-5); g.lineTo(14,-4); g.lineTo(14,4); g.lineTo(4,5);
  g.closePath(); g.fill(); g.stroke();

  const spin = o.static ? 0.9 : t*7.2;
  for(let i=0;i<3;i++){
    const a = spin + i*TAU/3;
    const c = Math.cos(a);
    const w = Math.abs(c)*13 + 2.5;
    const dir = Math.sin(a) >= 0 ? 1 : -1;
    const gg = g.createLinearGradient(0,-22*dir,0,4*dir);
    if(c>0){ gg.addColorStop(0,STEEL); gg.addColorStop(1,STEEL_D); }
    else   { gg.addColorStop(0,STEEL_D); gg.addColorStop(1,STEEL_XD); }
    g.fillStyle=gg; g.strokeStyle=OUT; g.lineWidth=LW;
    g.beginPath();
    g.moveTo(0,0);
    g.quadraticCurveTo(-w*.5, -12*dir, -w*.15, -21*dir);
    g.quadraticCurveTo( w*.55, -19*dir,  w*.45, -6*dir);
    g.quadraticCurveTo( w*.25, -1*dir, 0, 0);
    g.closePath(); g.fill(); g.stroke();
  }

  const hub=g.createRadialGradient(-2,-2,1,0,0,8);
  hub.addColorStop(0,'#eeeae4'); hub.addColorStop(.55,STEEL); hub.addColorStop(1,STEEL_D);
  g.fillStyle=hub; g.strokeStyle=OUT; g.lineWidth=LW;
  g.beginPath(); g.arc(0,0,7.5,0,TAU); g.fill(); g.stroke();
  g.fillStyle=STEEL_XD;
  g.beginPath(); g.arc(0,0,2.6,0,TAU); g.fill();
  g.restore();

  bodyPath();
  const bodyG=g.createLinearGradient(-20,-32,14,32);
  bodyG.addColorStop(0,  OR_HI);
  bodyG.addColorStop(.18, OR_L);
  bodyG.addColorStop(.52, OR);
  bodyG.addColorStop(.82, OR_D);
  bodyG.addColorStop(1,   OR_XD);
  g.fillStyle=bodyG; g.fill();

  g.save(); bodyPath(); g.clip();

  const belly=g.createLinearGradient(0,6,0,34);
  belly.addColorStop(0,'rgba(156,64,15,0)');
  belly.addColorStop(1,'rgba(120,44,8,.24)');
  g.fillStyle=belly; g.fillRect(-52,4,110,34);

  const topL=g.createLinearGradient(0,-32,0,-14);
  topL.addColorStop(0,'rgba(255,231,182,.75)');
  topL.addColorStop(1,'rgba(255,231,182,0)');
  g.fillStyle=topL; g.fillRect(-52,-34,110,22);

  const seam=(px,curve)=>{
    g.strokeStyle='rgba(107,52,16,.22)'; g.lineWidth=2.2;
    g.beginPath();
    g.moveTo(px,-34); g.quadraticCurveTo(px+curve,0,px,34); g.stroke();

    g.strokeStyle='rgba(255,214,160,.35)'; g.lineWidth=1.6;
    g.beginPath();
    g.moveTo(px+2,-34); g.quadraticCurveTo(px+curve+2,0,px+2,34); g.stroke();

    g.strokeStyle='rgba(90,44,10,.08)'; g.lineWidth=5;
    g.beginPath();
    g.moveTo(px,-34); g.quadraticCurveTo(px+curve,0,px,34); g.stroke();
  };
  seam(-30, 4);
  seam( 6,  5);

  const rivetRow=(x0,y0,x1,y1,n)=>{
    for(let i=0;i<n;i++){
      const k=i/(n-1);
      const px=x0+(x1-x0)*k, py=y0+(y1-y0)*k;
      g.fillStyle='rgba(107,52,16,.24)';
      g.beginPath(); g.arc(px,py+.7,1.9,0,TAU); g.fill();
      g.fillStyle='rgba(255,222,175,.55)';
      g.beginPath(); g.arc(px-.4,py-.5,1.5,0,TAU); g.fill();
    }
  };
  if(!o.simple){
  rivetRow(-40,-19, -20,-27, 4);
  rivetRow( -2,-29,  22,-24, 4);
  rivetRow(-40, 19, -20, 27, 4);
  rivetRow( -2, 29,  22, 24, 4);
  }

  const dent=(px,py,rx,ry,rot)=>{
    const d=g.createRadialGradient(px,py,.5,px,py,Math.max(rx,ry));
    d.addColorStop(0,'rgba(140,58,12,.10)'); d.addColorStop(1,'rgba(140,58,12,0)');
    g.fillStyle=d; g.save(); g.translate(px,py); g.rotate(rot);
    g.beginPath(); g.ellipse(0,0,rx,ry,0,0,TAU); g.fill(); g.restore();
  };
  dent(-34,-6,5,3.4,.3);
  dent( 30,-6,4,2.6,-.4);
  dent(-10,24,6,3,.1);

  const rootSh=(px,py,rx,ry)=>{
    const rs=g.createRadialGradient(px,py,1,px,py,Math.max(rx,ry));
    rs.addColorStop(0,'rgba(107,44,8,.18)'); rs.addColorStop(1,'rgba(107,44,8,0)');
    g.fillStyle=rs; g.beginPath(); g.ellipse(px,py,rx,ry,0,0,TAU); g.fill();
  };
  rootSh(-44,  0,10,16);

  g.restore();

  bodyPath(); g.strokeStyle=OUT; g.lineWidth=LW+.6; g.stroke();

  g.save(); bodyPath(); g.clip();
  const hs=g.createRadialGradient(-1,-28,2,-1,-28,22);
  hs.addColorStop(0,'rgba(107,44,8,.24)'); hs.addColorStop(1,'rgba(107,44,8,0)');
  g.fillStyle=hs; g.beginPath(); g.ellipse(-1,-27,22,8,0,0,TAU); g.fill();
  g.restore();

  g.save();
  g.translate(-1,-30);

  const filG=g.createLinearGradient(0,4,0,-6);
  filG.addColorStop(0,'rgba(205,92,27,0)'); filG.addColorStop(1,'rgba(205,92,27,.85)');
  g.fillStyle=filG;
  g.beginPath();
  g.moveTo(-22,6); g.quadraticCurveTo(-16,-2,-13,-4);
  g.lineTo(13,-4); g.quadraticCurveTo(16,-2,22,6);
  g.closePath(); g.fill();

  g.fillStyle=MET_D; g.strokeStyle=OUT; g.lineWidth=LW;
  g.beginPath();
  g.moveTo(-17,2); g.quadraticCurveTo(0,6,17,2);
  g.lineTo(15,-3); g.quadraticCurveTo(0,-1,-15,-3);
  g.closePath(); g.fill(); g.stroke();

  const hg=g.createLinearGradient(-14,-8,14,2);
  hg.addColorStop(0,'#f2c78a'); hg.addColorStop(.5,MET); hg.addColorStop(1,MET_D);
  g.fillStyle=hg;
  g.beginPath();
  g.moveTo(-14,-1);
  g.quadraticCurveTo(-14,-8.5,0,-8.5);
  g.quadraticCurveTo(14,-8.5,14,-1);
  g.closePath(); g.fill();
  g.strokeStyle=OUT; g.lineWidth=LW; g.stroke();

  g.fillStyle=MET; g.beginPath(); g.ellipse(0,-8.5,14,3.2,0,0,TAU); g.fill(); g.stroke();
  g.fillStyle='rgba(255,236,200,.5)';
  g.beginPath(); g.ellipse(-4,-9,6,1.4,0,0,TAU); g.fill();

  g.fillStyle=MET_XD; g.strokeStyle=OUT; g.lineWidth=2.4;
  g.beginPath(); g.rect(-16,-6,4.5,4); g.fill(); g.stroke();
  g.beginPath(); g.rect(11.5,-6,4.5,4); g.fill(); g.stroke();

  if(!o.simple){
  g.fillStyle='rgba(107,52,16,.26)';
  [-9,-3,3,9].forEach(px=>{ g.beginPath(); g.arc(px,-3.4,1.4,0,TAU); g.fill(); });
  }
  g.restore();

  const sideWin=(px,py,R)=>{

    g.save(); bodyPath(); g.clip();
    const ws=g.createRadialGradient(px,py,R*.85,px,py,R*1.55);
    ws.addColorStop(0,'rgba(107,44,8,.18)'); ws.addColorStop(1,'rgba(107,44,8,0)');
    g.fillStyle=ws; g.beginPath(); g.arc(px,py,R*1.55,0,TAU); g.fill();
    g.restore();

    const fr=g.createLinearGradient(px-R,py-R,px+R,py+R);
    fr.addColorStop(0,'#f6d29a'); fr.addColorStop(.5,MET); fr.addColorStop(1,MET_XD);
    g.fillStyle=fr; g.strokeStyle=OUT; g.lineWidth=LW;

let AC=null;
function ac(){
  if(!AC){ try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){ AC=null; } }
  try{ if(AC&&AC.state==='suspended'){ const p=AC.resume(); if(p&&p.catch) p.catch(()=>{}); } }catch(e){}
  return AC;
}
function tone(f,dur,type='sine',vol=.15,slide=0){
  const a=ac(); if(!a)return;
  const o=a.createOscillator(),g=a.createGain();
  o.type=type;o.frequency.value=f;
  if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),a.currentTime+dur);
  g.gain.setValueAtTime(vol,a.currentTime);
  g.gain.exponentialRampToValueAtTime(.0001,a.currentTime+dur);
  o.connect(g).connect(a.destination);o.start();o.stop(a.currentTime+dur);
}
function noiseHit(dur=.25,vol=.3,fc=800){
  const a=ac(); if(!a)return;
  const n=a.sampleRate*dur, buf=a.createBuffer(1,n,a.sampleRate), d=buf.getChannelData(0);
  for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);
  const s=a.createBufferSource(); s.buffer=buf;
  const f=a.createBiquadFilter(); f.type='lowpass'; f.frequency.value=fc;
  const g=a.createGain(); g.gain.value=vol;
  s.connect(f).connect(g).connect(a.destination); s.start();
}

function toXY(e){
  const r=cv.getBoundingClientRect();
  let p;
  if(e.touches && e.touches.length) p=e.touches[0];
  else if(e.changedTouches && e.changedTouches.length) p=e.changedTouches[0];
  else p=e;
  return {x:(p.clientX-r.left)/r.width*W, y:(p.clientY-r.top)/r.height*H};
}
function down(e){
  e.preventDefault();
  try{ ac(); }catch(err){}
  try{
    const p=toXY(e);
    if(mode==='menu'){
      if(bpOpen){ bpTap(p); return; }
      dragX=p.x; dragged=false; menu._downY=p.y; menu._lastY=p.y;
      return;
    }
    else if(mode==='play'){
      if(p.x>W-96 && p.x<W-48 && p.y>66 && p.y<110){ S.click(); prevMode=mode; mode='paused'; confirmEnd=false; joy=null; return; }
      joy={ox:p.x,oy:p.y,x:p.x,y:p.y,a:0};
    }
    else if(mode==='paused') pauseTap(p);
    else if(mode==='results'){ resultsTap(p); }
  }catch(err){ console.error('down() error:', err); }
}
function move(e){
  e.preventDefault();
  try{
    if(mode==='play'&&joy){ const p=toXY(e); joy.x=p.x; joy.y=p.y; }
    else if(mode==='menu' && bpOpen && dragX!==null){
      const p=toXY(e);
      if(menu._lastY!=null) bpScroll -= (p.y-menu._lastY);
      menu._lastY=p.y;
      if(Math.abs(p.y-(menu._downY||p.y))>8) dragged=true;
    }
    else if(mode==='menu' && cabinOpen && dragX!==null){
      const p=toXY(e);
      if(menu._lastY!=null) cabinScroll -= (p.y-menu._lastY);
      menu._lastY=p.y;
      if(Math.abs(p.y-(menu._downY||p.y))>8) dragged=true;
    }
    else if(mode==='menu' && dragX!==null){
      const p=toXY(e);
      if(Math.abs(p.x-dragX)>10 || Math.abs(p.y-(menu._downY||p.y))>10) dragged=true;
    }
  }catch(err){ console.error('move() error:', err); }
}
function up(e){
  e.preventDefault();
  try{
    if(joy)joy.dead=true;
    if(mode==='menu' && bpOpen){ dragX=null; dragged=false; menu._lastY=null; return; }
    if(mode==='menu' && dragX!==null){
      if(!dragged){
        const p=toXY(e);
        const tapP={x:p.x,y:menu._downY!=null?menu._downY:p.y};
        if(cabinOpen) cabinTap(tapP);
        else menuTap(tapP);
      }
      dragX=null; dragged=false; menu._lastY=null;
    }
  }catch(err){
    console.error('up() error:', err);
    dragX=null; dragged=false; menu._lastY=null;
  }
}

function coinBurst(layer,n,topPct,dur){
  dur=dur||860;
  for(let i=0;i<n;i++){
    const c=document.createElement('div');
    c.style.cssText=`position:absolute;left:50%;top:${topPct}%;width:27px;height:27px;margin:-13px;pointer-events:none`;
    c.innerHTML=coinSVG;
    layer.appendChild(c);
    const ang=-Math.PI/2 + (Math.random()-.5)*2.3;
    const dist=58+Math.random()*100;
    const dx=Math.cos(ang)*dist, dy=Math.sin(ang)*dist;
    c.animate([
      {transform:'translate(0,0) scale(.3) rotate(0deg)',opacity:1},
      {transform:`translate(${dx}px,${dy}px) scale(1) rotate(${200+Math.random()*300}deg)`,opacity:1,offset:.5},
      {transform:`translate(${dx*1.22}px,${dy+180}px) scale(.85) rotate(${430+Math.random()*300}deg)`,opacity:0}
    ],{duration:dur+Math.random()*(dur*.35),delay:i*40,easing:'cubic-bezier(.2,.7,.4,1)',fill:'forwards'});
  }
}

const today=()=>Math.floor(Date.now()/864e5);
function adReady(k){ return save.adDay[k]!==today(); }
function watchAd(k){
  if(!adReady(k)){ S.hurt(); toast('Günlük hakkın doldu, yarın tekrar gel! ⏳'); return; }
  save.adDay[k]=today();
  const b=BOOSTERS.find(x=>x.k===k);
  S.click();
  toast('Reklam yakında! Şimdilik hediye');
  save.boost[k]=(save.boost[k]||0)+1;
  setTimeout(()=>{ S.upgrade(); renderRoom(); toast(`${b.n} kazandın!`); },350);
}
function buyBoost(k){
  const b=BOOSTERS.find(x=>x.k===k);
  if(save.gold<b.cost){ S.hurt(); toast('Yeterli altın yok!'); return; }
  save.gold-=b.cost; save.boost[k]=(save.boost[k]||0)+1;
  S.upgrade(); renderRoom(); toast(`${b.n} alındı!`);
}
function buy(key){
  const lvl=save[key], cost=upCost(lvl);
  if(lvl>=10) return;
  if(save.gold<cost){ S.hurt(); toast('Yeterli altın yok!'); return; }
  save.gold-=cost; save[key]++; S.upgrade(); renderRoom();
  toast(key==='oxyLvl'?'Oksijen tüpü geliştirildi!':'Kıyafet geliştirildi!');
}

  setTimeout(()=>{ S.pop(); const gr=$('btlGrow'); if(gr){

    gr.style.transform='scale(1.07)';
    setTimeout(()=>{ gr.style.transform='scale(1)'; },180);

  setTimeout(()=>{
    S.paper();
    note.style.display='block';
    note.style.fontFamily='"Segoe Script","Comic Sans MS",cursive';
    note.innerHTML=`“${STORY[idx]}”`;
    if(last8) note.style.marginTop='48px'; else note.style.marginTop='';

    if(!last8){
      btn.style.display='';
      btn.onclick=()=>{ S.click(); $('reveal').classList.remove('show'); renderRoom(); };
    }
  },1750);

  if(last8){
    setTimeout(()=>{
      S.big();
      coinBurst($('bCoins'),12,72,1750);
      for(let k=0;k<4;k++)setTimeout(S.coin,k*130);
      save.gold+=500;

        {transform:'translate(-50%,0) scale(0)'},

        {transform:'translate(-50%,0) scale(1)'}
      ],{duration:430,easing:'cubic-bezier(.34,1.56,.64,1)',fill:'forwards'});
      setTimeout(()=>{
        btn.style.display='';
        btn.onclick=()=>{ S.click(); $('reveal').classList.remove('show'); renderRoom(); };
      },2300);
    },2450);
  }
}

const BP_STEP=500, BP_MAX=100000, BP_TIERS=BP_MAX/BP_STEP;

function bpMonthLeft(){

  const ms=end-now;
  const d=Math.floor(ms/864e5), h=Math.floor(ms/36e5)%24;

function drawDiamondBadge(g,cx0,cy0,r,filled,label){
  g.save(); g.translate(cx0,cy0); g.rotate(Math.PI/4);
  const s=r*1.3;
  g.fillStyle = filled? '#2f6fd0' : 'rgba(255,255,255,.14)';
  g.fillRect(-s/2,-s/2,s,s);
  g.lineWidth=3; g.strokeStyle= filled? '#123a6e' : 'rgba(11,42,65,.7)';
  g.strokeRect(-s/2,-s/2,s,s);

}

    const ang=seed*2.4+i*2.5;
    const rx=cx0+Math.cos(ang)*R*.82, ry=cy0+Math.sin(ang)*R*.82;
    const sz=2.6+alpha*3.2;
    g.save(); g.translate(rx,ry); g.rotate(a*2.2);
    g.fillStyle=`rgba(255,255,255,${alpha*.65})`;
    g.beginPath();
    g.moveTo(0,-sz); g.lineTo(sz*.28,-sz*.28); g.lineTo(sz,0); g.lineTo(sz*.28,sz*.28);
    g.lineTo(0,sz); g.lineTo(-sz*.28,sz*.28); g.lineTo(-sz,0); g.lineTo(-sz*.28,-sz*.28);
    g.closePath(); g.fill();
    g.restore();
  }
}

function cobweb(g,x,y,R,dir){
  g.save(); g.translate(x,y); g.scale(dir,1);
  g.strokeStyle='rgba(255,255,255,.30)'; g.lineWidth=1.2;
  for(let i=0;i<=4;i++){ const a=i*(Math.PI/2)/4;
    g.beginPath(); g.moveTo(0,0); g.lineTo(Math.cos(a)*R,Math.sin(a)*R); g.stroke(); }
  for(let r=R*.28;r<=R;r+=R*.24){
    g.beginPath();
    for(let i=0;i<=4;i++){ const a=i*(Math.PI/2)/4;
      const px=Math.cos(a)*r, py=Math.sin(a)*r;
      i? g.lineTo(px,py) : g.moveTo(px,py); }
    g.stroke();
  }
  g.restore();
}

function drawRoundIcon(g,x,y){
  g.beginPath(); g.arc(x,y,26,0,TAU);
  g.fillStyle='rgba(9,42,66,.85)'; g.fill();
  g.lineWidth=5; g.strokeStyle='#0b2a41'; g.stroke();
  g.save(); g.translate(x,y);
  g.fillStyle='#cfe3f5'; g.strokeStyle='#0b2a41'; g.lineWidth=1.4;
  const teeth=8, rOuter=9, toothLen=3;
  g.beginPath();
  for(let i=0;i<teeth*2;i++){
    const a=i*Math.PI/teeth;
    const rad=i%2===0? rOuter+toothLen : rOuter;
    const px=Math.cos(a)*rad, py=Math.sin(a)*rad;
    i===0?g.moveTo(px,py):g.lineTo(px,py);
  }
  g.closePath(); g.fill(); g.stroke();
  g.fillStyle='#0b2a41';
  g.beginPath(); g.arc(0,0,3.4,0,TAU); g.fill();
  g.restore();
}
function drawCoin(g,x,y,r,spin){

  const a=spin*3;
  const c=Math.cos(a), sn=Math.sin(a);
  const w=Math.max(.07,Math.abs(c));
  const off=r*.32*sn;
  const rw=r*w;
  g.save(); g.translate(x,y); g.lineJoin='round';

  const eg=g.createLinearGradient(0,-r,0,r);
  eg.addColorStop(0,'#d09a20'); eg.addColorStop(.5,'#a87614'); eg.addColorStop(1,'#7a4c00');
  g.fillStyle=eg;
  g.beginPath(); g.ellipse(off,0,rw,r,0,0,TAU); g.fill();
  if(Math.abs(off)>.6){
    g.fillRect(Math.min(0,off),-r,Math.abs(off),2*r);

    g.strokeStyle='rgba(90,58,0,.45)'; g.lineWidth=1;
    for(let i=1;i<=3;i++){ const lx=Math.min(0,off)+Math.abs(off)*i/4;
      g.beginPath(); g.moveTo(lx,-r*.9); g.lineTo(lx,r*.9); g.stroke(); }
  }
  g.strokeStyle='#6b4200'; g.lineWidth=Math.max(1.4,r*.09);
  g.beginPath(); g.ellipse(off,0,rw,r,0,0,TAU); g.stroke();

  const back=c<0;
  const fg=g.createRadialGradient(-rw*.35,-r*.35,r*.12,0,0,r);
  if(back){ fg.addColorStop(0,'#eec14a'); fg.addColorStop(.7,'#d6a026'); fg.addColorStop(1,'#b07f16'); }
  else { fg.addColorStop(0,'#fff0b0'); fg.addColorStop(.55,'#ffd95c'); fg.addColorStop(1,'#e8a81e'); }
  g.beginPath(); g.ellipse(0,0,rw,r,0,0,TAU); g.fillStyle=fg; g.fill();
  g.lineWidth=r*.2; g.strokeStyle=back?'#8a5c00':'#c07d00';
  g.beginPath(); g.ellipse(0,0,Math.max(.6,rw-r*.09),r*.91,0,0,TAU); g.stroke();

  g.beginPath(); g.ellipse(0,0,Math.max(.4,rw*.55),r*.55,0,0,TAU);
  g.strokeStyle=back?'rgba(140,92,0,.55)':'#e8b93c'; g.lineWidth=r*.16; g.stroke();

  g.save(); g.beginPath(); g.ellipse(0,0,Math.max(.5,rw*.9),r*.9,0,0,TAU); g.clip();
  g.fillStyle=`rgba(255,255,255,${back?.16:.32})`;
  g.beginPath(); g.ellipse(c*rw*.5,-r*.08,Math.max(1,rw*.2),r*.75,.25,0,TAU); g.fill();
  g.restore();
  g.restore();
}

const PXM=3;
const DM=0.0542;
const SPEED_RAMP_TIME=180;
const SPEED_BASE=58, SPEED_CAP=10/DM;
const DARK_RAMP_TIME=420;
const SZ=1.4;
function zoneColor(d){
  const dm = Math.min(d*DM, 3500);
  const stops=[[0,'#2b9fdd'],[400,'#1e85c6'],[900,'#146aa8'],[1500,'#0d5390'],
    [2200,'#093e74'],[2800,'#062c58'],[3500,'#041d3e']];
  for(let i=0;i<stops.length-1;i++){
    if(dm<=stops[i+1][0]){
      const t=(dm-stops[i][0])/(stops[i+1][0]-stops[i][0]);
      return mixHex(stops[i][1],stops[i+1][1],clamp(t,0,1));
    }
  }
  return stops[stops.length-1][1];
}
function zoneIdx(d){ d*=0.28;
 return d<1000?0 : d<3000?1 : d<6000?2 : d<9000?3 : 4; }

function clearSpot(x,d,minX,maxX){
  for(let tr=0;tr<9;tr++){
    let ok=true;
    for(const o of ents){
      if(o.dead) continue;
      const near = (o.type==='mine')? 62 : 96;
      if(Math.abs(o.d-d)<54 && Math.abs(o.x-x)<near){ ok=false; break; }
    }
    if(ok) return {x,d};
    if(tr<6) x=rnd(minX,maxX);
    else d+=50;
  }
  return {x,d};
}
let lastMinePair = null;
function spawnWorld(){
  const ahead = depth + (H+160)/PXM;
  lastMinePair = null;

  while(spawnNext.ob < ahead){
    const d=spawnNext.ob, z=zoneIdx(d);

    const type = Math.random()<.2808 ? 'jelly' : 'mine';
    const mnX = type==='puffer'?205 : type==='lion'?185 : type==='barrel'?60 : 52;
    if(type==='mine' && Math.random()<.733){

      const gapX=rnd(58,74);
      const gapD=rnd(16,26);
      const flip=Math.random()<.5?1:-1;
      const overlaps=(px,pd)=>ents.some(o=>!o.dead && Math.abs(o.d-pd)<54 && Math.abs(o.x-px)<((o.type==='mine')?62:96));
      let x1,x2,d1,d2;
      for(let tr=0;tr<9;tr++){
        const cx2=rnd(52+gapX/2, W-52-gapX/2);
        x1=cx2-gapX/2; x2=clamp(cx2+gapX/2,52,W-52);
        d1=d-gapD/2*flip; d2=d1+gapD*flip;
        if(!overlaps(x1,d1) && !overlaps(x2,d2)) break;
        if(tr>=6){ d1+=50; d2+=50; }
      }
      ents.push({type:'mine',x:x1,d:d1,ph:rnd(0,TAU),ob:1});
      ents.push({type:'mine',x:x2,d:d2,ph:rnd(0,TAU),ob:1});
      lastMinePair = {x:(x1+x2)/2, d:Math.max(d1,d2)};
    } else {
      const sp=clearSpot(rnd(mnX,W-mnX),d,mnX,W-mnX);
      ents.push({type,x:sp.x,d:sp.d,ph:rnd(0,TAU),ob:1});
    }
    spawnNext.ob += OBST_GAP*obMul*rnd(.455,.733)*(1 - Math.min(.42,d/24000));
  }

  COLS.forEach(([k,iv,gold])=>{

    while(spawnNext[k] < ahead){
      const z=zoneIdx(spawnNext[k]);
      let skip=false;
      if(k==='shell' && z>=3 && Math.random()<.55) skip=true;
      if(k==='bottle' && save.bottlesRead+save.bottlesHeld+runBottles>=STORY.length) skip=true;

      if(!skip){
        let dd=spawnNext[k];
        let px=rnd(60,W-60);
        let nearMine=false;

        if(k==='tank' && lastMinePair && Math.random()<.75){
          dd = lastMinePair.d + rnd(60,95);
          px = clamp(lastMinePair.x + rnd(-14,14), 60, W-60);
          nearMine=true;
        }
        if(!nearMine){
          const GAP=((H+80)/PXM)*(run.map? .42 : 1);
          if(dd < lastColD+GAP) dd = lastColD+GAP+rnd(10,70);
        }
        const sp=clearSpot(px,dd,60,W-60);
        ents.push({type:k,x:sp.x,d:sp.d,ph:rnd(0,TAU),gold});
        lastColD=Math.max(lastColD,sp.d);
      }
      spawnNext[k]+= iv*colMul*rnd(.85,1.15);
    }
  });

  ents=ents.filter(e=> e.d > depth-430/PXM && !e.dead);
}

function updatePlay(dt0){
  const dt=dt0*slowmo;
  runTime += dt;

  let spd = Math.min(SPEED_CAP, SPEED_BASE + (runTime/SPEED_RAMP_TIME)*(SPEED_CAP-SPEED_BASE));
  depth += spd*dt;

  let target=0;
  if(joy&&!joy.dead){
    const dx=joy.x-joy.ox, dy=joy.y-joy.oy, len=Math.hypot(dx,dy);
    const m=Math.min(len,64);
    if(len>4) target=dx/len*m/64*(330+spd*1.1);
    joy.a=Math.min(1,joy.a+dt*8);
  } else if(joy){ joy.a-=dt*5; if(joy.a<=0)joy=null; }
  P.vx=lerp(P.vx,target,1-Math.pow(.0008,dt));
  P.x=clamp(P.x+P.vx*dt,56,W-56);
  P.tilt=lerp(P.tilt,P.vx*.0016,1-Math.pow(.001,dt));

  if(P.vx > 60) subFace=1;
  else if(P.vx < -60) subFace=-1;

  P.oxy -= dt*1.40416/oxyMult(save.oxyLvl);
  P.inv=Math.max(0,P.inv-dt);

  if(Math.random()<dt*8){
    const tp=tailXY(heroScale());
    bubbles.push({x:tp.x+rnd(-9,9), y:tp.y+rnd(-7,7), vy:rnd(-60,-110), r:rnd(2,5), a:1});
  }
  bubbles.forEach(b=>{ b.y+=(b.vy - spd*PXM*.4)*dt; b.a-=dt*.5; b.x+=Math.sin(t*4+b.r)*12*dt; });
  bubbles=bubbles.filter(b=>b.a>0&&b.y>-20);

  spawnWorld();

  ents.forEach(e=>{

    if(e.type==='jelly' && !e.dead) e.d -= 34*dt;
    const sy=(e.d-depth)*PXM+P.y;
    if(sy<-120||sy>H+160) return;
    let ex=e.x, ey=sy;
    if(e.type==='mine'){ ey+=Math.sin(t*2+e.ph)*8; }
    if(e.type==='barrel'){ ey+=Math.sin(t*1.5+e.ph)*7; }
    if(e.type==='puffer'){ ex+=Math.sin(t*0.986+e.ph)*150; }
    if(e.type==='jelly'){ ey+=Math.sin(t*1.8+e.ph)*22; }
    if(e.type==='lion'){ ex+=Math.sin(t*2.099+e.ph)*130; }
    if(!e.ob){ ex+=Math.sin(t*.9+e.ph)*15.5; }
    ex=clamp(ex,46,W-46);
    e.sx=ex; e.sy=ey;
    if(e.type==='deco'||e.dead) return;
    const rad = (e.ob? (e.type==='lion'?34: e.type==='barrel'?32: e.type==='shark'?26: 30) : 30)*SZ;
    if(Math.hypot(ex-P.x,ey-P.y) < rad+30){
      if(e.ob){
        if(P.inv>0) return;
        const dmg={mine:110,puffer:90,jelly:160,lion:260,barrel:90,shark:130}[e.type];
        P.hp-=dmg; P.inv=1.2; shake=8; flash=.35;
        popups.push({txt:'-'+dmg,x:ex,y:ey,a:1.25,c:'#ff7a6b',dmg:1});
        if(e.type==='mine'){ S.hurt(); e.dead=true; }
        else { S.hurt(); e.hitT=.6; }
        if(P.hp<=0){ P.hp=0; startHook(); }
      } else collect(e,ex,ey);
    }
  });

  popups.forEach(p=>{
    if(p.dmg){ p.age=(p.age||0)+dt; p.a = p.age<1.2? 1 : Math.max(0,1-(p.age-1.2)/.5); }
    else { p.y-=40*dt; p.a-=dt*1.1; }
  });
  popups=popups.filter(p=> p.dmg? (p.age||0)<1.7 : p.a>0);
  flyCoins.forEach(f=>{
    if(f.pop){ f.t+=dt*1.25; f.x=f.x0; f.y=f.y0-=spd*PXM*dt*.35; return; }
    f.t+=dt*1.8;
    f.x=lerp(f.x0,W-70,f.t*f.t); f.y=lerp(f.y0,40,f.t);
    if(f.t>=1&&!f.done){f.done=true;S.coin();}
  });
  flyCoins=flyCoins.filter(f=>f.t<1);

  hudHp=P.hp/P.hpMax;
  hudOxy=lerp(hudOxy,P.oxy/P.oxyMax,1-Math.pow(.002,dt));
  dispDepth=lerp(dispDepth,depth,1-Math.pow(.0001,dt));
  dispCoins=lerp(dispCoins,runCoins,1-Math.pow(.001,dt));

  shake=Math.max(0,shake-dt*40); flash=Math.max(0,flash-dt*2);

  if(P.oxy<=0 && mode==='play') startHook();
}
function burst(x,y,c,n){
  for(let i=0;i<n;i++){ const a=rnd(0,TAU),v=rnd(60,240);
    popups.push({spark:1,x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,a:1,c}); }
}
function collect(e,ex,ey){
  e.dead=true;
  if(e.type==='tank'){ P.oxy=Math.min(P.oxyMax,P.oxy+P.oxyMax*.161); S.bubble(); S.big();
    popups.push({txt:'+O₂',x:ex,y:ey,a:1,c:'#9fdcff',s:'#0b2a41'}); burst(ex,ey,'#9fdcff',8); return; }
  if(e.type==='bottle'){ runBottles++; S.pop(); burst(ex,ey,'#9be8d8',8); flyCoins.push({x0:ex,y0:ey,x:ex,y:ey,t:0,kind:'bottle',pop:1}); return; }

  const g=e.gold||0; runCoins+=g;
  (g>=100?S.big:S.coin)();
  popups.push({txt:'+'+g,x:ex,y:ey,a:1,c:'#ffd95c'});
  burst(ex,ey,'#ffd95c',g>=100?14:7);
  flyCoins.push({x0:ex,y0:ey,x:ex,y:ey,t:0,kind:'coin'});
}
function startHook(){
  mode='hooked'; hook={t:0};
  S.hurt(); flash=.85; shake=16;
}

let subFace=1;

function heroScale(){
  const pufR = 25*SZ*.87;
  const subHalf = 64;
  return (pufR*1.08*1.14*1.417)/subHalf * 1.11;
}

function tailXY(s){
  const flip = subFace<0;
  const DOWN = .30;
  const world = (flip? -DOWN : DOWN) - P.tilt*.5;
  const lx = (flip? 56 : -56)*s;
  return { x:P.x+lx*Math.cos(world), y:P.y+lx*Math.sin(world), flip, world };
}
function heroDive(g,x,y,s){
  const tp=tailXY(s);
  drawSubmarine(g, x, y, s, {flip:tp.flip, tilt:tp.world, t, simple:true, winScale:1.06});
}

function rockEdge(g,side){
  const seg=118;
  const off=depth*PXM - P.y;
  const i0=Math.floor((off-140)/seg);
  const kMax=Math.ceil((H+280)/seg)+2;
  const pts=[];
  for(let k=0;k<=kMax;k++){
    const i=i0+k;
    const h =Math.abs(Math.sin(i*127.13+side*3.71));
    const h2=Math.abs(Math.sin(i*57.77+side*1.3));
    pts.push({h,h2, w:10+h*20, y:i*seg-off,
      mx:(side<0?1:-1)*(Math.abs(Math.sin(i*311.7))*8-3)});
  }
  const edgeX=w=> side<0? w : W-w;
  const path=(wScale,yoff)=>{
    g.beginPath();
    g.moveTo(side<0?-26:W+26, pts[0].y-seg+yoff);
    for(let k=0;k<pts.length;k++){
      const p=pts[k], n=pts[Math.min(k+1,pts.length-1)];
      const px=edgeX(p.w*wScale), nx=edgeX(n.w*wScale);
      g.lineTo(px,p.y+yoff);
      g.lineTo((px+nx)/2 + p.mx*wScale, (p.y+n.y)/2+yoff);
    }
    g.lineTo(side<0?-26:W+26, pts[pts.length-1].y+yoff);
    g.closePath();
  };

  path(1.7,18);
  g.fillStyle='rgba(3,13,27,.26)'; g.fill();

  path(1.32,9);
  g.fillStyle='rgba(4,15,30,.34)'; g.fill();

  path(1,0);
  const gr=g.createLinearGradient(side<0?0:W,0, side<0?46:W-46,0);
  gr.addColorStop(0,'rgba(7,20,38,1)');
  gr.addColorStop(.6,'rgba(6,17,33,.55)');
  gr.addColorStop(1,'rgba(6,17,33,.22)');
  g.fillStyle=gr; g.fill();

  path(1,0);
  g.strokeStyle='rgba(140,200,250,.08)'; g.lineWidth=7; g.stroke();
  path(1,0);
  g.strokeStyle='rgba(0,5,12,.5)'; g.lineWidth=3; g.stroke();

  for(const p of pts){
    const bx=edgeX(p.w);

    if(p.h>.3){
      g.strokeStyle='rgba(150,205,255,.11)'; g.lineWidth=2.4; g.lineCap='round';
      g.beginPath();
      g.moveTo(bx+(side<0?-9:9), p.y-9);
      g.lineTo(bx, p.y);
      g.stroke();
    }

    if(p.h2>.35){
      g.strokeStyle='rgba(0,6,14,.20)'; g.lineWidth=2.2;
      g.beginPath();
      g.moveTo(side<0?-4:W+4, p.y+seg*.3);
      g.lineTo(bx+(side<0?2:-2), p.y+seg*.3+(p.h2-.5)*10);
      g.stroke();
    }

    if(p.h>.55){
      g.strokeStyle='rgba(0,4,10,.28)'; g.lineWidth=1.8;
      g.beginPath();
      g.moveTo(bx, p.y+seg*.55);
      g.lineTo(bx-(side<0?1:-1)*(4+p.h2*5), p.y+seg*.55+6);
      g.lineTo(bx-(side<0?1:-1)*(2+p.h2*3), p.y+seg*.55+13);
      g.stroke();
    }

    if(p.h2>.68){
      g.fillStyle='rgba(0,6,15,.20)';
      g.beginPath();
      g.moveTo(side<0?0:W, p.y+seg*.7);
      g.lineTo(bx-(side<0?1:-1), p.y+seg*.72);
      g.lineTo(side<0?0:W, p.y+seg*.92);
      g.closePath(); g.fill();
    }

    if(p.h>.42 && p.h2<.5){
      g.fillStyle='rgba(120,170,220,.06)';
      g.beginPath(); g.ellipse(bx+(side<0?-6:6), p.y+seg*.5, 3.6,2.2, side*.4,0,TAU); g.fill();
    }

    if(p.h2>.45 && p.h2<.62){
      g.strokeStyle='rgba(140,190,240,.07)'; g.lineWidth=1.6;
      g.beginPath();
      g.moveTo(side<0?2:W-2, p.y+seg*.15);
      g.quadraticCurveTo(bx*.6+(side<0?0:W*.4), p.y+seg*.45, bx+(side<0?-2:2), p.y+seg*.8);
      g.stroke();
    }
  }
}

function drawPlay(dt){
  const g=cx;
  g.save();
  if(shake>0) g.translate(rnd(-shake,shake),rnd(-shake,shake));

  const scroll=depth*PXM;

  const darkProgress=Math.min(1, runTime/DARK_RAMP_TIME);
  const effDepth=(darkProgress*3500)/DM;
  const bgGrad=g.createLinearGradient(0,0,0,H);
  bgGrad.addColorStop(0,zoneColor(effDepth-160));
  bgGrad.addColorStop(.45,zoneColor(effDepth+260));
  bgGrad.addColorStop(1,zoneColor(effDepth+1200));
  g.fillStyle=bgGrad; g.fillRect(-20,-20,W+40,H+40);

  for(let i=0;i<4;i++){
    let yy=(i*333.7 - scroll*.22)%(H+360); if(yy<0)yy+=H+360; yy-=180;
    const xx=(i*211.3)%W + Math.sin(t*.25+i*1.9)*32;
    const rw=170+(i%2)*70;
    const dg=g.createRadialGradient(xx,yy,20,xx,yy,rw);
    dg.addColorStop(0,'rgba(2,14,30,.10)'); dg.addColorStop(1,'rgba(2,14,30,0)');
    g.fillStyle=dg; g.beginPath(); g.ellipse(xx,yy,rw,rw*.58,0,0,TAU); g.fill();
  }

  for(let i=0;i<3;i++){
    let yy=(i*430 - scroll*.14)%(H+320); if(yy<0)yy+=H+320; yy-=160;
    const sg2=g.createLinearGradient(0,yy-70,0,yy+70);
    sg2.addColorStop(0,'rgba(0,0,0,0)'); sg2.addColorStop(.5,'rgba(3,18,36,.07)'); sg2.addColorStop(1,'rgba(0,0,0,0)');
    g.fillStyle=sg2; g.fillRect(-20,yy-70,W+40,140);
  }

  if(depth<1700){
    const a=clamp(1-depth/1700,0,1);
    g.save(); g.globalCompositeOperation='screen';

    const dome=g.createLinearGradient(0,-20,0,H*.75);
    dome.addColorStop(0,`rgba(205,238,255,${.15*a})`);
    dome.addColorStop(1,'rgba(205,238,255,0)');
    g.fillStyle=dome; g.fillRect(-20,-20,W+40,H*.78);

    const sway=Math.sin(t*.3)*26;
    for(let i=0;i<3;i++){
      const bw=140+i*36;
      const cxr=76+i*186+sway;
      const al=(.11+i*.02)*a*(.82+.18*Math.sin(t*.7+i*.9));
      g.save();
      g.translate(cxr,-30); g.rotate(.13); g.scale(1,5.6);
      const rg=g.createRadialGradient(0,bw*.22,4, 0,bw*.22,bw*.62);
      rg.addColorStop(0,`rgba(255,251,226,${Math.max(0,al)})`);
      rg.addColorStop(.55,`rgba(255,251,226,${Math.max(0,al*.45)})`);
      rg.addColorStop(1,'rgba(255,251,226,0)');
      g.fillStyle=rg;
      g.beginPath(); g.arc(0,bw*.22,bw*.62,0,TAU); g.fill();
      g.restore();
    }
    g.restore();
  }

  {
    const ca=clamp(1-depth/3200,0,1);
    if(ca>0){
      g.save(); g.globalCompositeOperation='screen';
      for(let i=0;i<7;i++){
        let yy=(i*263 - scroll*.5)%(H+200); if(yy<0)yy+=H+200; yy-=100;
        const xx=(i*181.7)%W + Math.sin(t*.55+i*2.1)*26;
        const rx=58+(i%3)*26;
        const al=ca*(.05+(i%3)*.018)*(.7+.3*Math.sin(t*1.2+i*1.7));
        if(al<=0) continue;
        const lg=g.createRadialGradient(xx,yy,4,xx,yy,rx);
        lg.addColorStop(0,`rgba(215,242,255,${Math.max(0,al)})`); lg.addColorStop(1,'rgba(215,242,255,0)');
        g.fillStyle=lg; g.beginPath(); g.ellipse(xx,yy,rx,rx*.42,0,0,TAU); g.fill();
      }
      g.restore();
    }
  }

  for(let L=0;L<3;L++){
    const par=[.9,.6,.35][L], n=[14,20,26][L], r=[2.6,1.8,1.2][L], al=[.16,.11,.07][L];
    g.fillStyle=`rgba(214,238,255,${al})`;
    for(let i=0;i<n;i++){
      const px=(i*197.3 + L*71.7)%W;
      let py=(i*389.7 - scroll*par)%(H+90); if(py<0)py+=H+90; py-=45;
      g.beginPath(); g.arc(px+Math.sin(t*.7+i)*6,py,r,0,TAU); g.fill();
    }
  }

  for(let i=0;i<5;i++){
    let py=(i*467.9 - scroll*.95)%(H+140); if(py<0)py+=H+140; py-=70;
    const px=(i*233.5)%W + Math.sin(t*.5+i)*10;
    const rb=7+(i%3)*4;
    const bg3=g.createRadialGradient(px,py,1,px,py,rb);
    bg3.addColorStop(0,'rgba(220,242,255,.10)'); bg3.addColorStop(1,'rgba(220,242,255,0)');
    g.fillStyle=bg3; g.beginPath(); g.arc(px,py,rb,0,TAU); g.fill();
  }

  {
    const hz=g.createLinearGradient(0,0,0,H);
    hz.addColorStop(0,'rgba(255,255,255,.05)'); hz.addColorStop(.5,'rgba(0,0,0,0)'); hz.addColorStop(1,'rgba(0,8,22,.20)');
    g.fillStyle=hz; g.fillRect(-20,-20,W+40,H+40);
    const vg=g.createRadialGradient(W/2,H*.42,H*.34,W/2,H*.42,H*.78);
    vg.addColorStop(0,'rgba(0,0,0,0)'); vg.addColorStop(1,'rgba(2,10,25,.24)');
    g.fillStyle=vg; g.fillRect(-20,-20,W+40,H+40);
  }

  rockEdge(g,-1); rockEdge(g,1);

  ents.forEach(e=>drawEnt(g,e));

  bubbles.forEach(b=>{
    g.strokeStyle=`rgba(255,255,255,${b.a*.7})`; g.lineWidth=2;
    g.beginPath(); g.arc(b.x,b.y,b.r,0,TAU); g.stroke();
  });

  if(P.inv>0 && mode==='play'){
    const ph=(1.2-P.inv)/1.2;
    const alpha = 0.42 + 0.58*Math.abs(Math.cos(ph*Math.PI*6));
    g.save(); g.globalAlpha=alpha;
    heroDive(g,P.x,P.y,heroScale());
    g.restore();
  } else {
    heroDive(g,P.x,P.y,heroScale());
  }

  popups.forEach(p=>{
    if(p.spark){ p.x+=p.vx*dt; p.y+=p.vy*dt; p.vx*=.92; p.vy*=.92; p.a-=dt*2;
      g.fillStyle=p.c; g.globalAlpha=Math.max(0,p.a);
      g.beginPath(); g.arc(p.x,p.y,3.4,0,TAU); g.fill(); g.globalAlpha=1;
    } else if(p.dmg){
      const ag=p.age||0;
      let sc;
      if(ag<.14) sc=.3+(ag/.14)*1.15;
      else if(ag<.32) sc=1.45-((ag-.14)/.18)*.45;
      else if(ag<1.2) sc=1;
      else sc=Math.max(.15,1-((ag-1.2)/.5)*.85);
      g.save(); g.translate(p.x,p.y); g.scale(sc,sc);
      g.globalAlpha=Math.min(1,Math.max(0,p.a));
      outlineText(p.txt,0,0,40,p.c,'#4a0d0d');
      g.restore(); g.globalAlpha=1;
    } else { g.globalAlpha=Math.min(1,Math.max(0,p.a)); outlineText(p.txt,p.x,p.y,26,p.c,p.s||'#5a3a00'); g.globalAlpha=1; }
  });

  flyCoins.forEach(f=>{
    if(f.kind==='coin'){ drawCoin(g,f.x,f.y,12,t+f.t*6); return; }

    const k=f.t;
    const sc = k<.42 ? .95+ (k/.42)*.85
                     : 1.8*(1-(k-.42)/.58);
    if(sc<=0.02) return;
    g.save(); g.globalAlpha=Math.max(0,1-Math.max(0,(k-.55)/.45));
    drawBottleIcon(g,f.x,f.y,sc*.5);
    g.restore(); g.globalAlpha=1;
  });

  if(flash>0){ g.fillStyle=`rgba(255,70,70,${flash*.35})`; g.fillRect(-20,-20,W+40,H+40); }
  g.restore();

  drawHUD(g);

  if(joy&&joy.a>0){
    const dx=joy.x-joy.ox, dy=joy.y-joy.oy, len=Math.hypot(dx,dy)||1;
    const m=Math.min(len,64), kx=joy.ox+dx/len*m, ky=joy.oy+dy/len*m;
    g.globalAlpha=joy.a*.55;
    g.beginPath(); g.arc(joy.ox,joy.oy,64,0,TAU);
    g.fillStyle='rgba(255,255,255,.16)'; g.fill();
    g.lineWidth=4; g.strokeStyle='rgba(255,255,255,.5)'; g.stroke();
    g.beginPath(); g.arc(kx,ky,30,0,TAU);
    g.fillStyle='rgba(255,255,255,.65)'; g.fill();
    g.globalAlpha=1;
  }
}

function glowBob(g,e,fade){
  const bb=Math.sin(t*2+e.ph)*5.55;
  g.save(); g.globalAlpha=fade; g.translate(e.sx,e.sy+bb); g.scale(SZ,SZ);
  const gl=g.createRadialGradient(0,0,6,0,0,38);
  gl.addColorStop(0,'rgba(255,240,170,.17)'); gl.addColorStop(1,'rgba(255,240,170,0)');
  g.fillStyle=gl; g.beginPath(); g.arc(0,0,38,0,TAU); g.fill();
  return bb;
}
function drawEnt(g,e){
  const sy=(e.d-depth)*PXM+P.y;
  if(sy<-170||sy>H+210) return;

  const fade = clamp((sy+150)/180,0,1) * clamp((H+190-sy)/150,0,1);
  if(fade<=0) return;
  e.sy=sy + (e.type==='mine'?Math.sin(t*2+e.ph)*8:0) + (e.type==='barrel'?Math.sin(t*1.5+e.ph)*7:0) + (e.type==='jelly'?Math.sin(t*1.8+e.ph)*22:0);

function drawBar(g,x,y,w,h,frac,c1,c2,icon){

}

        cabinPending-=dt;
        if(Math.random()<dt*30){
          for(let k=0;k<2;k++) menu.steam.push({x:76+rnd(-22,22), y:96.6+rnd(-20,20), vy:rnd(-46,-76), a:rnd(.55,.85), r:rnd(4,7.5)});
        }
        if(cabinPending<=0){ cabinPending=0; cabinOpen=true; }
      }
      drawMenu(dt,0);
      if(cabinOpen){
        const PW=W*.9, PH=H*.82, PX=(W-PW)/2, PY=42;
        const cScale=PW/W;
        const CAB_CONTENT_H=980;
        const maxCabScroll=Math.max(0, CAB_CONTENT_H - PH/cScale);
        cabinScroll=clamp(cabinScroll,0,maxCabScroll);
        cx.fillStyle='rgba(3,14,24,.72)'; cx.fillRect(0,0,W,H);
        cx.save();
        rr(PX,PY,PW,PH,26); cx.clip();
        cx.translate(PX, PY - cabinScroll*cScale);
        cx.scale(cScale, cScale);
        drawPageCabin(cx,dt);
        cx.restore();
        cx.lineWidth=5; cx.strokeStyle='#0b2a41';
        rr(PX,PY,PW,PH,26); cx.stroke();
        drawCabinClose(cx, PX+PW-28, PY+28);
      }
      if(bpOpen) drawBattlePass(cx,dt);
    }
    else if(mode==='play'){ updatePlay(dt); drawPlay(dt); }
    else if(mode==='paused'){ drawPaused(dt); }
    else if(mode==='hooked'){ updateHooked(dt); drawHooked(dt); }
    else if(mode==='results'){ drawResults(dt); }
  }catch(err){
    console.error('frame() error, recovering to menu:', err);

    try{ mode='menu'; joy=null; dragX=null; bpOpen=false; cabinOpen=false; cabinPending=0; }catch(e2){}
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
